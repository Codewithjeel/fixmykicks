[build]
  publish = "."

# Cache images for 7 days on Netlify CDN to optimize performance
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Ensure live inventory and settings are always fresh
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
